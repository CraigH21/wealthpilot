<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="18" fill="#0B1117" stroke="#1F2937"/>

  <!-- Glass orb -->
  <circle cx="32" cy="32" r="20"
          fill="url(#ai)" fill-opacity="0.12"
          stroke="url(#ai)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- AI sparkle / coach icon -->
  <path d="M32 16l2.5 6.5L41 25l-6.5 2.5L32 34l-2.5-6.5L23 25l6.5-2.5L32 16z"
        fill="url(#ai)"/>

  <circle cx="22" cy="38" r="2" fill="#8B5CF6"/>
  <circle cx="42" cy="42" r="2" fill="#22D3EE"/>

  <!-- Connecting arc -->
  <path d="M24 40c2.5-3 6-5 8-5s5.5 2 8 5"
        stroke="url(#ai)" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>

  <!-- Glass highlight -->
  <path d="M18 20c4-5 10-8 16-8"
        stroke="white" stroke-opacity="0.18"
        stroke-width="2" stroke-linecap="round"/>
</svg>

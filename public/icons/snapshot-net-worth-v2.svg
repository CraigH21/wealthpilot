<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00F5A0"/>
    <stop offset="100%" stop-color="#00C2FF"/>
  </linearGradient>
</defs>

<rect width="64" height="64" rx="18" fill="#0B1117" stroke="#1F2937"/>

<!-- Glass circle -->
<circle cx="32" cy="32" r="20" fill="url(#emerald)" fill-opacity="0.12"
        stroke="url(#emerald)" stroke-opacity="0.45" stroke-width="1.5"/>

<!-- Wealth / net worth icon -->
<path d="M20 36l6-8 5 6 5-10 8 12"
      stroke="url(#emerald)" stroke-width="3.5"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>

<circle cx="44" cy="26" r="2.5" fill="#00F5A0"/>

<!-- Glass highlight -->
<path d="M18 20c4-5 10-8 16-8"
      stroke="white" stroke-opacity="0.18" stroke-width="2"
      stroke-linecap="round"/>
</svg>